name: Hash Static Assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hash-static-assets-main
  cancel-in-progress: true

jobs:
  hash-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate hashed CSS and JS files
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/hash_static_assets.py

      - name: Commit and push updated asset references
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No asset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh hashed assets [skip ci]"
          git push origin HEAD:main
